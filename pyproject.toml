[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog"
version = "0.1.0"
description = "Watchdog: wideband RF sweep monitor with per-band alerts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Jacob", email = "you@example.com" }
]
dependencies = [
  "numpy",
  "click"
]

[project.scripts]
watchdog-sweep = "hackrf_watchdog.cli:main"
watchdog-doctor = "hackrf_watchdog.doctor:main"
